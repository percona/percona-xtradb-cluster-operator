name: Add Jira ticket to PR
description: Branch names contain Jira ticket names. This workflow adds the ticket name to the PR description and it becomes clickable automatically
on:
  pull_request_target:
    types: [opened]

permissions:
  pull-requests: write

jobs:
  add-ticket:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = pr.body || '';
            const marker = '<!-- jira-ticket -->';
            const prefixes = ['K8SPXC', 'CLOUD'];
            const findKey = () => {
              const sources = [
                [pr.head.ref, true],
                [pr.title, false],
              ];
              for (const prefix of prefixes) {
                for (const [value, anchored] of sources) {
                  const source = anchored ? `^(${prefix}-\\d+)` : `\\b(${prefix}-\\d+)\\b`;
                  const match = (value || '').match(new RegExp(source));
                  if (match) return match[1];
                }
              }
            };
            const key = findKey();
            if (!key) return;
            const newBody = body.includes(marker)
              ? body.replace(marker, key)
              : `Jira: ${key}\n\n${body}`;
            await github.rest.pulls.update({
              ...context.repo,
              pull_number: pr.number,
              body: newBody,
            });
