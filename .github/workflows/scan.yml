name: Scan docker
on: [pull_request]

env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: docker.io

  # github.repository as <account>/<repo>
  IMAGE_NAME: perconalab/percona-xtradb-cluster-operator

  # Final image must stay below this RootFS layer count.
  MAX_IMAGE_LAYERS: 40

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build an image from Dockerfile (linux/arm64)
        run: |
          export IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}-arm64
          export DOCKER_PUSH=0
          export DOCKER_SQUASH=0
          export DOCKER_DEFAULT_PLATFORM='linux/arm64'
          ./e2e-tests/build

      - name: Check image layer count (linux/arm64)
        run: |
          image="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}-arm64"
          layers=$(docker inspect --format='{{len .RootFS.Layers}}' "$image")
          echo "$image has $layers layers (must be fewer than ${{ env.MAX_IMAGE_LAYERS }})"
          if [ "$layers" -ge "${{ env.MAX_IMAGE_LAYERS }}" ]; then
            echo "::error::Docker image $image has $layers layers, which is greater than ${{ env.MAX_IMAGE_LAYERS }} allowed by Openshift certification"
            exit 1
          fi


      - name: Build an image from Dockerfile (linux/amd64)
        run: |
          export IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}-amd64
          export DOCKER_PUSH=0
          export DOCKER_SQUASH=0
          export DOCKER_DEFAULT_PLATFORM='linux/amd64'
          ./e2e-tests/build

      - name: Check image layer count (linux/amd64)
        run: |
          image="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}-amd64"
          layers=$(docker inspect --format='{{len .RootFS.Layers}}' "$image")
          echo "$image has $layers layers (must be fewer than ${{ env.MAX_IMAGE_LAYERS }})"
          if [ "$layers" -ge "${{ env.MAX_IMAGE_LAYERS }}" ]; then
            echo "::error::Docker image $image has $layers layers, which is greater than ${{ env.MAX_IMAGE_LAYERS }} allowed by Openshift certification"
            exit 1
          fi