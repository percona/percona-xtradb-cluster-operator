apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: s3-tls-certs
spec:
  commonName: s3-storage-all-in-one.#namespace
  dnsNames:
  - s3-storage-all-in-one.#namespace
  - s3-storage-all-in-one.#namespace.svc.cluster.local
  secretName: s3-tls-certs
  issuerRef:
    name: selfsigning-issuer