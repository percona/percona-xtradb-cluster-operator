apiVersion: pxc.percona.com/v1
kind: PerconaXtraDBClusterBackup
metadata:
  name: backup-incr-2
  finalizers:
    - percona.com/delete-backup
spec:
  pxcCluster: demand-backup-incr
  storageName: local-s3
  type: incremental
  activeDeadlineSeconds: 7200
  # Implicit base again. This one must chain onto backup-incr-1, not restart the
  # chain from the full backup.
