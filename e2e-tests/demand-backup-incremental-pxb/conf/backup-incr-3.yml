apiVersion: pxc.percona.com/v1
kind: PerconaXtraDBClusterBackup
metadata:
  name: backup-incr-3
  finalizers:
    - percona.com/delete-backup
spec:
  pxcCluster: demand-backup-incr
  storageName: local-s3
  type: incremental
  # The base is pinned explicitly here. It names the FULL backup, which is the
  # root of the chain; the predecessor this backup actually takes its LSN from
  # must still be the newest succeeded incremental (backup-incr-2). If it
  # branched off the full backup instead, the LSN ranges would overlap and the
  # restore of this backup would fail to --prepare.
  incrementalBaseBackupName: backup-full
  activeDeadlineSeconds: 7200
