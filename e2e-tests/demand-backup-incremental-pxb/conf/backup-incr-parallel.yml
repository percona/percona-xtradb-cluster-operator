apiVersion: pxc.percona.com/v1
kind: PerconaXtraDBClusterBackup
metadata:
  name: backup-incr-parallel
  # This backup does reach object storage, so it needs the finalizer that
  # removes its objects again - the suite asserts an empty bucket at the end.
  finalizers:
    - percona.com/delete-backup
spec:
  pxcCluster: demand-backup-incr
  storageName: local-s3
  type: incremental
  activeDeadlineSeconds: 7200
