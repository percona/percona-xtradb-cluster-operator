apiVersion: pxc.percona.com/v1
kind: PerconaXtraDBClusterRestore
metadata:
  name: on-demand-backup-local-s3
spec:
  pxcCluster: demand-backup
  backupName: on-demand-backup-local-s3
  containerOptions:
    args:
      xbstream: 
      - '--parallel=3'
      xbcloud: 
      - '--parallel=3'
      xtrabackup: 
      - '--parallel=3'
  resources:
    requests:
      memory: 0.5G
      cpu: 500m
    limits:
      memory: "2G"
      cpu: "1"
