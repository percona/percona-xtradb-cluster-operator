apiVersion: pxc.percona.com/v1
kind: PerconaXtraDBClusterRestore
metadata:
  annotations:
    percona.com/unsafe-pitr: "true"
  name: restore-on-pitr-local-s3-invalid
spec:
  pxcCluster: pitr-gap-errors
  backupName: on-pitr-local-s3-1
  pitr:
    type: transaction
    gtid: <gtid>
    backupSource:
      storageName: "local-s3-binlogs"
