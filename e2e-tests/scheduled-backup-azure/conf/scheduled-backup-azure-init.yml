apiVersion: pxc.percona.com/v1-6-0
kind: PerconaXtraDBCluster
metadata:
  name: scheduled-backup
spec:
  secretsName: my-cluster-secrets
  sslSecretName: some-name-ssl
  sslInternalSecretName: some-name-ssl-internal
  pxc:
    size: 3
    image: -pxc
    volumeSpec:
      persistentVolumeClaim:
        resources:
          requests:
            storage: 2Gi
  proxysql:
    enabled: true
    size: 2
    image: -proxysql
    volumeSpec:
      persistentVolumeClaim:
        resources:
          requests:
            storage: 2Gi
  pmm:
    enabled: false
  backup:
    image: -backup
    storages:
      azure-blob:
        type: azure
        labels:
          test: testLabel
          backupWorker: 'True'
        azure:
          credentialsSecret: azure-secret
          container: operator-testing
        nodeSelector:
          backupWorker: 'True'
        resources:
          requests:
            memory: 1G
            cpu: 600m
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
              - matchExpressions:
                - key: backupWorker
                  operator: In
                  values:
                  - 'True'
        tolerations:
          - key: "backupWorker"
            operator: "Equal"
            value: "True"
            effect: "NoSchedule"
        annotations:
          testName: scheduled-backup
        schedulerName: 'default-scheduler'
        priorityClassName: 'high-priority'
